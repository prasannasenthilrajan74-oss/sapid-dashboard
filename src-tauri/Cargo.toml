[package]
name = "sapid-license-analyzer"
version = "1.0.0"
description = "SAPID License Analyzer - Cross-Platform SAP User License Dashboard"
authors = []
edition = "2021"

[lib]
name = "sapid_license_analyzer_lib"
crate-type = ["rlib"]

[[bin]]
name = "sapid-license-analyzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = 0
incremental = false
split-debuginfo = "off"
opt-level = 0
