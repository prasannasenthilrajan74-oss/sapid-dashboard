<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillTrack Analyzer</title>
  <link rel="stylesheet" href="/public/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow-top"></div>
  <div class="bg-glow-right"></div>

  <!-- Login Container -->
  <div id="login-container" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🔒</div>
        <h2>SkillTrack Analyzer</h2>
        <p>Please sign in to access the training dashboard</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">User ID</label>
          <input type="text" id="username" placeholder="Enter User ID" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" placeholder="Enter Password" required autocomplete="current-password">
            <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Toggle password visibility">
              <svg id="eye-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me-label">
            <input type="checkbox" id="remember-me">
            <span class="remember-me-text">Remember me</span>
          </label>
        </div>

        <div id="login-error-msg" class="login-error-msg hidden"></div>

        <button type="submit" id="login-submit-btn" class="login-submit-btn">
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/public/login.js"></script>
</body>
</html>
